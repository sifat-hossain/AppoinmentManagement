name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AppoinmentManagement\AppointmentManagement.sln

      - name: Build
        run: dotnet build AppoinmentManagement\AppointmentManagement.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AppoinmentManagement\AppointmentManagement.sln --no-build --verbosity normal
